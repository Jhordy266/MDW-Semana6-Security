<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Administrar libros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/inicio}">
            Biblioteca
        </a>

        <div class="d-flex align-items-center text-white">

            <span class="usuario-navbar">
                Usuario:
                <strong sec:authentication="name"></strong>
            </span>

            <form th:action="@{/logout}"
                  method="post">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container contenedor-principal">

    <div class="tabla-contenedor shadow-sm">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Administrar libros</h2>

            <div>

                <a th:href="@{/admin/libros/nuevo}"
                   class="btn btn-success">
                    Agregar libro
                </a>

                <a th:href="@{/inicio}"
                   class="btn btn-secondary">
                    Volver
                </a>

            </div>

        </div>

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead class="table-dark">

                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Categoría</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="libro : ${libros}">

                    <td th:text="${libro.titulo}"></td>

                    <td th:text="${libro.autor}"></td>

                    <td th:text="${libro.categoria}"></td>

                    <td th:text="${libro.estado}"></td>

                    <td>

                        <a th:href="@{/admin/libros/editar/{id}(id=${libro.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/admin/libros/eliminar/{id}(id=${libro.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('¿Desea eliminar este libro?');">

                            <button type="submit"
                                    class="btn btn-danger btn-sm">
                                Eliminar
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
