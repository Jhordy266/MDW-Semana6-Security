<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

<h2>Iniciar sesión</h2>

<form action="/login" method="post">
    <label>Usuario:</label>
    <input type="text" name="username">

    <br><br>

    <label>Contraseña:</label>
    <input type="password" name="password">

    <br><br>

    <button type="submit">Ingresar</button>
</form>

</body>
</html>
