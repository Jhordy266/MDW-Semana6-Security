<!-- libro-form.html -->
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libro</title>
</head>
<body>

<h1>Registrar / Editar libro</h1>

<form th:action="@{/admin/libros/guardar}"
      th:object="${libro}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <label>Título:</label>
    <input type="text"
           th:field="*{titulo}"
           required>

    <br><br>

    <label>Autor:</label>
    <input type="text"
           th:field="*{autor}"
           required>

    <br><br>

    <label>Categoría:</label>
    <input type="text"
           th:field="*{categoria}"
           required>

    <br><br>

    <label>Estado:</label>

    <select th:field="*{estado}">
        <option value="DISPONIBLE">
            Disponible
        </option>

        <option value="PRESTADO">
            Prestado
        </option>
    </select>

    <br><br>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/admin/libros">Volver</a>

</body>
</html>
