<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${libro.id == null ? 'Agregar libro' : 'Editar libro'}">
        Libro
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/inicio}">
            Biblioteca
        </a>

        <div class="d-flex align-items-center text-white">

            <span class="usuario-navbar">
                Usuario:
                <strong sec:authentication="name"></strong>
            </span>

            <form th:action="@{/logout}"
                  method="post">

                <button class="btn btn-outline-light btn-sm"
                        type="submit">
                    Cerrar sesión
                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container contenedor-principal">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4"
                th:text="${libro.id == null ? 'Agregar libro' : 'Editar libro'}">
                Libro
            </h2>

            <form th:action="@{/admin/libros/guardar}"
                  th:object="${libro}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="mb-3">

                    <label for="titulo"
                           class="form-label">
                        Título
                    </label>

                    <input type="text"
                           class="form-control"
                           id="titulo"
                           th:field="*{titulo}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="autor"
                           class="form-label">
                        Autor
                    </label>

                    <input type="text"
                           class="form-control"
                           id="autor"
                           th:field="*{autor}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="categoria"
                           class="form-label">
                        Categoría
                    </label>

                    <input type="text"
                           class="form-control"
                           id="categoria"
                           th:field="*{categoria}"
                           required>

                </div>

                <div class="mb-3">

                    <label for="estado"
                           class="form-label">
                        Estado
                    </label>

                    <select class="form-select"
                            id="estado"
                            th:field="*{estado}"
                            required>

                        <option value="DISPONIBLE">
                            Disponible
                        </option>

                        <option value="PRESTADO">
                            Prestado
                        </option>

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Guardar
                </button>

                <a th:href="@{/admin/libros}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
