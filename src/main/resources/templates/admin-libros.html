<!-- admin-libros.html -->
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar libros</title>
</head>
<body>

<h1>Administrar libros</h1>

<a href="/admin/libros/nuevo">Nuevo libro</a>

<br><br>

<table border="1">
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>Categoría</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>

    <tr th:each="libro : ${libros}">
        <td th:text="${libro.titulo}"></td>
        <td th:text="${libro.autor}"></td>
        <td th:text="${libro.categoria}"></td>
        <td th:text="${libro.estado}"></td>

        <td>
            <a th:href="@{/admin/libros/editar/{id}(id=${libro.id})}">
                Editar
            </a>

            <form th:action="@{/admin/libros/eliminar/{id}(id=${libro.id})}"
                  method="post"
                  style="display:inline">

                <button type="submit">
                    Eliminar
                </button>

            </form>
        </td>
    </tr>
</table>

<br>

<a href="/inicio">Volver</a>

</body>
</html>
